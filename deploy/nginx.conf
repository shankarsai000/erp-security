events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # High-Performance JSON Log Format for Security Audits & SIEM Ingestion
    log_format json_combined escape=json
      '{'
        '"timestamp": "$time_iso8601",'
        '"request_id": "$request_id_out",'
        '"source_ip": "$remote_addr",'
        '"method": "$request_method",'
        '"path": "$request_uri",'
        '"status": $status,'
        '"body_size": $body_bytes_sent,'
        '"response_time_ms": $request_time,'
        '"upstream_time": "$upstream_response_time",'
        '"user_agent": "$http_user_agent"'
      '}';

    access_log /var/log/nginx/access.log json_combined;
    error_log /var/log/nginx/error.log warn;

    sendfile        on;
    keepalive_timeout  65;

    # Upstream: ERP Security Gateway
    upstream security_gateway {
        server gateway:8000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    # Upstream: Staging ERP Backend
    upstream erp_backend {
        server fake_erp:8001;
        keepalive 32;
    }

    # Trace ID propagation mapping
    map $http_x_request_id $request_id_out {
        default $http_x_request_id;
        "" $request_time-$msec;
    }

    server {
        listen 80;
        server_name _;

        # Security Headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # Health probe endpoint
        location /health {
            access_log off;
            default_type application/json;
            return 200 '{"status":"ok","component":"nginx-reverse-proxy"}';
        }

        # Route all /api/ traffic directly into the Security Gateway
        location /api/ {
            proxy_pass http://security_gateway;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            
            # Forward client headers & trace IDs
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id_out;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Resilient Timeouts
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_send_timeout 15s;

            # Disable buffering for low latency streaming
            proxy_buffering off;
        }
    }
}

# Risk Assessment Matrix: Prioritized by Likelihood × Impact
# Source: Phase 0 Ground Truth (MASTER_IMPLEMENTATION_PROMPT Task 0.5)
# Last updated: 2026-09-15

high_priority_risks:
  - id: "RISK-01"
    threat: "SQL Injection via API parameters or body payloads"
    category: "Tampering / Information Disclosure"
    likelihood: "HIGH"
    impact: "CRITICAL"
    risk_rating: "CRITICAL"
    mitigation: "Deterministic WAF rules in security gateway, schema validation, parameterized queries in backend"
    owner: "Security Engineering"
    target_sla: "Immediate blocking at gateway (HTTP 403)"

  - id: "RISK-02"
    threat: "BOLA / IDOR (Broken Object Level Authorization)"
    category: "Elevation of Privilege"
    likelihood: "HIGH"
    impact: "CRITICAL"
    risk_rating: "CRITICAL"
    mitigation: "JWT token subject-to-resource authorization checks at gateway and backend"
    owner: "Backend Engineering"
    target_sla: "Enforce ownership validation before DB lookup"

  - id: "RISK-03"
    threat: "Credential Stuffing & Brute-Force Attacks on /api/auth/login"
    category: "Spoofing"
    likelihood: "HIGH"
    impact: "HIGH"
    risk_rating: "HIGH"
    mitigation: "IP-level rate limiting, velocity anomaly tracking (>5 failures in 5m = challenge/block), CAPTCHA/MFA"
    owner: "Security Engineering"
    target_sla: "Throttle after 5 attempts/min; block after 15"

  - id: "RISK-04"
    threat: "API Scraping and Rate Abuse"
    category: "Denial of Service"
    likelihood: "MEDIUM"
    impact: "HIGH"
    risk_rating: "HIGH"
    mitigation: "Token bucket rate limiting per client IP and user account via Redis"
    owner: "DevOps & Gateway Team"
    target_sla: "Enforce 120 req/min default with HTTP 429 response"

medium_priority_risks:
  - id: "RISK-05"
    threat: "Cross-Site Scripting (XSS) in mobile webview components"
    category: "Tampering"
    likelihood: "MEDIUM"
    impact: "MEDIUM"
    risk_rating: "MEDIUM"
    mitigation: "WAF pattern matching for script tags and javascript uri schemes; Content-Security-Policy headers"
    owner: "Frontend & Security Team"
    target_sla: "Block malicious payloads at gateway"

  - id: "RISK-06"
    threat: "Man-in-the-Middle (MITM) Interception on Public Wi-Fi"
    category: "Information Disclosure"
    likelihood: "LOW"
    impact: "CRITICAL"
    risk_rating: "MEDIUM"
    mitigation: "Enforce TLS 1.3, strict cipher suites, HSTS, and mobile certificate pinning"
    owner: "Infrastructure Team"
    target_sla: "Reject non-TLS traffic at Nginx reverse proxy"
